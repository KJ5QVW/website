<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photos - Liam Sanders - KJ5QVW</title>

    <link rel="icon" type="image/png" href="../android-chrome-512x5x12.png">

    <style>
        /* ==============================
           MAIN WEBSITE COLORS
           ============================== */

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #071a33;
            color: #ffffff;
        }

        /* ==============================
           HEADER
           ============================== */

        header {
            background: #0b2a52;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #1e90ff;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 18px;
            color: #b9d9ff;
        }

        /* ==============================
           NAVIGATION BAR
           ============================== */

        nav {
            background: #051326;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #4da6ff;
        }

        /* ==============================
           MAIN CONTENT
           ============================== */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .card {
            background: #0b2547;
            border: 1px solid #164b82;
            border-radius: 12px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .card h2 {
            color: #4da6ff;
            margin-top: 0;
            font-size: 30px;
        }

        .card p {
            color: #b9d9ff;
            line-height: 1.6;
            font-size: 17px;
        }

        /* ==============================
           FLICKR BUTTON
           ============================== */

        .flickr-button {
            display: inline-block;
            background: #1261a0;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .flickr-button:hover {
            background: #1e90ff;
        }

        /* ==============================
           FOOTER
           ============================== */

        footer {
            background: #051326;
            text-align: center;
            padding: 25px;
            color: #9bb8d4;
            margin-top: 40px;
        }

        /* ==============================
           MOBILE PHONE DISPLAY
           ============================== */

        @media (max-width: 600px) {

            header h1 {
                font-size: 30px;
            }

            nav a {
                display: block;
                margin: 10px;
            }

            main {
                padding: 20px 12px;
            }

            .card {
                padding: 25px 18px;
            }

        }
    </style>

</head>

<body>

<!-- ==============================
     HEADER
     ============================== -->

<header>

    <h1>📷 Photos</h1>

    <p>
        Liam Sanders
    </p>

</header>


<!-- ==============================
     NAVIGATION
     ============================== -->

<nav>

    <a href="/">Home</a>
    <a href="/radio/">Radio</a>
    <a href="/photos/">Photos</a>
    <a href="/personal/">Personal</a>

</nav>


<!-- ==============================
     MAIN CONTENT
     ============================== -->

<main>

    <section class="card">

        <h2>My Photos</h2>

        <p>
            Check out my photography, travel photos,
            radio-related photos, and other pictures
            on my Flickr page.
        </p>

        <a class="flickr-button"
           href="https://www.flickr.com/photos/bcscodecatcher/"
           target="_blank"
           rel="noopener noreferrer">
            📷 View My Flickr
        </a>

    </section>

</main>


<!-- ==============================
     FOOTER
     ============================== -->

<footer>

    <p>
        © 2026 Liam Sanders
    </p>

</footer>

</body>
</html>
