<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liam Sanders - KJ5QVW</title>

    <link rel="icon" type="image/png" href="android-chrome-512x5x12.png">

    <style>
        /* ==============================
           MAIN WEBSITE COLORS
           ============================== */

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #071a33;
            color: #ffffff;
        }

        /* ==============================
           HEADER
           ============================== */

        header {
            background: #0b2a52;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #1e90ff;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 18px;
            color: #b9d9ff;
        }

        /* ==============================
           NAVIGATION BAR
           ============================== */

        nav {
            background: #051326;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #4da6ff;
        }

        /* ==============================
           MAIN CONTENT
           ============================== */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .card {
            background: #0b2547;
            border: 1px solid #164b82;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #4da6ff;
            margin-top: 0;
        }

        /* ==============================
           SHORTCUT LINKS
           ============================== */

        .shortcuts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .shortcut {
            background: #0b2547;
            border: 1px solid #164b82;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }

        .shortcut:hover {
            border-color: #1e90ff;
            transform: translateY(-4px);
        }

        .shortcut h2 {
            color: #4da6ff;
            margin-top: 0;
        }

        .shortcut p {
            color: #b9d9ff;
            line-height: 1.5;
        }

        .shortcut-button {
            display: inline-block;
            background: #1261a0;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            margin-top: 10px;
            font-weight: bold;
        }

        .shortcut:hover .shortcut-button {
            background: #1e90ff;
        }

        /* ==============================
           QRZ BOX
           ============================== */

        .qrz-box {
            text-align: center;
        }

        .qrz-box p {
            color: #b9d9ff;
        }

        .button {
            display: inline-block;
            background: #1261a0;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .button:hover {
            background: #1e90ff;
        }

        /* ==============================
           FOOTER
           ============================== */

        footer {
            background: #051326;
            text-align: center;
            padding: 25px;
            color: #9bb8d4;
            margin-top: 40px;
        }

        /* ==============================
           MOBILE PHONE DISPLAY
           ============================== */

        @media (max-width: 700px) {

            header h1 {
                font-size: 30px;
            }

            nav a {
                display: block;
                margin: 10px;
            }

            main {
                padding: 20px 12px;
            }

            .shortcuts {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
