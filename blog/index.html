<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Blog - KJ5QVW</title><link rel="icon" type="image/png" href="../android-chrome-512x512.png"><style>
:root{--bg:#07111f;--surface:#0d1b2d;--text:#f4f7fb;--muted:#9eafc2;--accent:#4da3ff;--border:#1b3149;--max:900px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.site-header{border-bottom:1px solid var(--border);background:rgba(7,17,31,.95);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.header-inner{max-width:1080px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{text-decoration:none;display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand strong{font-size:18px}.brand span{color:var(--muted);font-size:14px}nav{display:flex;gap:26px}nav a{text-decoration:none;color:var(--muted);font-size:14px}nav a:hover,nav a.active{color:var(--text)}main{max-width:var(--max);margin:auto;padding:68px 24px}.intro{margin-bottom:44px}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:clamp(40px,6vw,58px);line-height:1.05;letter-spacing:-.04em;margin:0 0 14px}.intro p{color:var(--muted);font-size:17px;margin:0}.post{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:27px 29px;margin-bottom:18px}.post h2{font-size:23px;margin:0 0 6px}.post-date{color:var(--muted);font-size:13px;margin-bottom:13px}.post-excerpt{color:var(--muted)}.read-more{display:inline-block;margin-top:18px;color:var(--accent);text-decoration:none;font-size:14px}.read-more:hover{color:#8ac7ff}.empty{border:1px dashed var(--border);border-radius:14px;text-align:center;color:var(--muted);padding:40px}.site-footer{max-width:var(--max);margin:auto;padding:0 24px 35px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.admin-login{color:#667a90;text-decoration:none}.admin-login:hover{color:var(--accent)}@media(max-width:600px){.header-inner{padding:15px 18px;align-items:flex-start}.brand{flex-direction:column;gap:0}nav{gap:12px;justify-content:flex-end;flex-wrap:wrap}nav a{font-size:13px}main{padding:52px 18px}.post{padding:22px}.site-footer{padding:0 18px 28px;flex-direction:column;gap:8px}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/"><strong>Liam Sanders</strong><span>KJ5QVW</span></a><nav><a href="/">Home</a><a href="/radio/">Radio</a><a href="/photos/">Photos</a><a href="/personal/">Personal</a><a class="active" href="/blog/">Blog</a></nav></div></header><main><section class="intro"><p class="eyebrow">Writing</p><h1>Blog.</h1><p>Posts, projects, and other things I'm working on.</p></section><div id="posts"><div class="empty">Loading posts...</div></div></main><footer class="site-footer"><span>© 2026 Liam Sanders</span><a class="admin-login" href="/admin/8vK3qP7mX2/">Admin Login</a></footer><script>
async function loadPosts(){const container=document.getElementById("posts");try{const response=await fetch("/api/posts");if(!response.ok)throw new Error("Unable to load posts.");const posts=await response.json();if(!posts.length){container.innerHTML='<div class="empty">No blog posts yet.</div>';return}container.innerHTML=posts.map(post=>{const date=new Date(post.created_at).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});return `<article class="post"><h2>${escapeHTML(post.title)}</h2><div class="post-date">${date}</div><div class="post-excerpt">${escapeHTML(post.excerpt||"")}</div><a class="read-more" href="/blog/post.html?id=${post.id}">Read more →</a></article>`}).join("")}catch(error){container.innerHTML='<div class="empty">Unable to load blog posts.</div>'}}
function escapeHTML(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}loadPosts();
</script></body></html>
