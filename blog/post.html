<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Blog Post - KJ5QVW</title><link rel="icon" type="image/png" href="../android-chrome-512x512.png"><style>
:root{--bg:#07111f;--surface:#0d1b2d;--text:#f4f7fb;--muted:#9eafc2;--accent:#4da3ff;--border:#1b3149;--max:900px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}.site-header{border-bottom:1px solid var(--border);background:rgba(7,17,31,.95);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.header-inner{max-width:1080px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{text-decoration:none;display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand strong{font-size:18px}.brand span{color:var(--muted);font-size:14px}nav{display:flex;gap:26px}nav a{text-decoration:none;color:var(--muted);font-size:14px}nav a:hover,nav a.active{color:var(--text)}main{max-width:var(--max);margin:auto;padding:68px 24px}article{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px}.post-title{font-size:clamp(32px,5vw,48px);line-height:1.1;letter-spacing:-.035em;margin:0 0 10px}.date{color:var(--muted);font-size:13px;margin-bottom:30px}.content{color:#d8e2ed;line-height:1.85;white-space:pre-line}.back{display:inline-block;margin-top:30px;color:var(--accent);text-decoration:none;font-size:14px}.back:hover{color:#8ac7ff}.site-footer{max-width:var(--max);margin:auto;padding:0 24px 35px;color:var(--muted);font-size:13px}@media(max-width:600px){.header-inner{padding:15px 18px;align-items:flex-start}.brand{flex-direction:column;gap:0}nav{gap:12px;justify-content:flex-end;flex-wrap:wrap}nav a{font-size:13px}main{padding:52px 18px}article{padding:25px 20px}.site-footer{padding:0 18px 28px}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/"><strong>Liam Sanders</strong><span>KJ5QVW</span></a><nav><a href="/">Home</a><a href="/radio/">Radio</a><a href="/photos/">Photos</a><a href="/personal/">Personal</a><a class="active" href="/blog/">Blog</a></nav></div></header><main><article id="post">Loading...</article></main><footer class="site-footer">© 2026 Liam Sanders</footer><script>
async function loadPost(){const id=new URLSearchParams(window.location.search).get("id"),container=document.getElementById("post");if(!id){container.innerHTML='<h1 class="post-title">Post not found</h1><a class="back" href="/blog/">← Back to Blog</a>';return}try{const response=await fetch("/api/post?id="+encodeURIComponent(id));if(!response.ok)throw new Error();const post=await response.json();document.title=post.title+" - KJ5QVW";const date=new Date(post.created_at).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});container.innerHTML=`<h1 class="post-title">${escapeHTML(post.title)}</h1><div class="date">${date}</div><div class="content">${escapeHTML(post.content)}</div><a class="back" href="/blog/">← Back to Blog</a>`}catch{container.innerHTML='<h1 class="post-title">Post not found</h1><a class="back" href="/blog/">← Back to Blog</a>'}}function escapeHTML(text){const div=document.createElement("div");div.textContent=text||"";return div.innerHTML}loadPost();
</script></body></html>
