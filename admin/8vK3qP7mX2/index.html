<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Admin - KJ5QVW</title>

    <link rel="icon" type="image/png" href="../../android-chrome-512x512.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #071a33;
            color: white;
        }

        header {
            background: #0b2a52;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #1e90ff;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
            color: #b9d9ff;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .card {
            background: #0b2547;
            border: 1px solid #164b82;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            color: #4da6ff;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 0 0 18px;

            background: #051326;
            border: 1px solid #164b82;
            border-radius: 6px;

            color: white;
            font-family: inherit;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1e90ff;
        }

        textarea {
            min-height: 320px;
            resize: vertical;
        }

        button,
        .button-link {
            display: inline-block;

            background: #1261a0;
            border: none;
            border-radius: 6px;

            color: white;
            padding: 11px 18px;

            font-weight: bold;
            font-size: 14px;

            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .button-link:hover {
            background: #1e90ff;
        }

        .delete {
            background: #8b2635;
        }

        .delete:hover {
            background: #b83246;
        }

        .cancel {
            background: #555;
        }

        .cancel:hover {
            background: #777;
        }

        .logout {
            background: #555;
        }

        .logout:hover {
            background: #777;
        }

        .post {
            border-top: 1px solid #164b82;
            padding: 20px 0;
        }

        .post:first-child {
            border-top: none;
            padding-top: 0;
        }

        .post h3 {
            margin: 0 0 7px;
            color: #4da6ff;
            font-size: 21px;
        }

        .date {
            color: #9bb8d4;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .excerpt {
            color: #b9d9ff;
            margin-bottom: 15px;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #dashboard {
            display: none;
        }

        #message {
            margin-bottom: 15px;
            color: #b9d9ff;
        }

        .error {
            color: #ff9b9b !important;
        }

        .success {
            color: #8ff0a4 !important;
        }

        .empty {
            color: #9bb8d4;
            text-align: center;
            padding: 20px 0;
        }

        .form-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-links {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        footer {
            background: #051326;
            text-align: center;
            padding: 25px;
            color: #9bb8d4;
            margin-top: 40px;
        }

        @media (max-width: 700px) {

            main {
                padding: 20px 12px;
            }

            header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<header>

    <h1>KJ5QVW Blog Admin</h1>

    <p>Liam Sanders</p>

</header>


<main>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="login" class="card">

        <h2>Admin Login</h2>

        <p>
            Enter the administrator password to manage the blog.
        </p>

        <form id="loginForm">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <div id="dashboard">


        <!-- ========================= -->
        <!-- CREATE / EDIT POST -->
        <!-- ========================= -->

        <div class="card">

            <h2 id="formTitle">
                Create Blog Post
            </h2>

            <div id="message"></div>

            <form id="postForm">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    maxlength="200"
                    required
                >


                <label for="excerpt">
                    Excerpt
                </label>

                <input
                    type="text"
                    id="excerpt"
                    maxlength="500"
                    placeholder="Short description shown on the blog page"
                >


                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    required
                    placeholder="Write your blog post here..."
                ></textarea>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="submitButton"
                    >
                        Publish Post
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel"
                        onclick="cancelEdit()"
                        style="display:none;"
                    >
                        Cancel Edit
                    </button>

                </div>

            </form>

        </div>


        <!-- ========================= -->
        <!-- EXISTING POSTS -->
        <!-- ========================= -->

        <div class="card">

            <h2>
                Existing Posts
            </h2>

            <div id="posts">

                <div class="empty">
                    Loading posts...
                </div>

            </div>


            <div class="admin-links">

                <a
                    class="button-link"
                    href="/blog/"
                    target="_blank"
                >
                    View Blog
                </a>

                <button
                    class="logout"
                    onclick="logout()"
                >
                    Log Out
                </button>

            </div>

        </div>


    </div>


</main>


<footer>

    <p>
        © 2026 Liam Sanders
    </p>

</footer>


<script>


/* =========================================================
   GLOBAL EDIT STATE
   ========================================================= */

let editingPostId = null;


/* =========================================================
   CHECK LOGIN
   ========================================================= */

async function checkLogin() {

    try {

        const response =
            await fetch("/api/admin/posts");

        if (response.ok) {

            showDashboard();

        }

    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

function showDashboard() {

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("dashboard")
        .style.display = "block";

    loadPosts();

}


/* =========================================================
   LOGIN
   ========================================================= */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password")
                    .value;

            try {

                const response =
                    await fetch(
                        "/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                password: password
                            })
                        }
                    );


                if (response.ok) {

                    document.getElementById("password")
                        .value = "";

                    showDashboard();

                } else {

                    const data =
                        await response
                            .json()
                            .catch(() => ({}));

                    alert(
                        data.error ||
                        "Incorrect password."
                    );

                }

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to the server."
                );

            }

        }
    );


/* =========================================================
   CREATE / UPDATE POST
   ========================================================= */

document
    .getElementById("postForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document.getElementById("title")
                    .value
                    .trim();

            const excerpt =
                document.getElementById("excerpt")
                    .value
                    .trim();

            const content =
                document.getElementById("content")
                    .value
                    .trim();

            const message =
                document.getElementById("message");


            if (!title || !content) {

                message.textContent =
                    "Title and content are required.";

                message.className = "error";

                return;

            }


            try {


                /* =========================
                   EDIT EXISTING POST
                   ========================= */

                if (editingPostId !== null) {

                    const response =
                        await fetch(
                            "/api/admin/posts?id=" +
                            encodeURIComponent(
                                editingPostId
                            ),
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    title: title,
                                    excerpt: excerpt,
                                    content: content

                                })
                            }
                        );


                    if (response.ok) {

                        message.textContent =
                            "Post updated successfully.";

                        message.className =
                            "success";

                        cancelEdit();

                        await loadPosts();

                        return;

                    }


                    if (response.status === 401) {

                        alert(
                            "Your admin session has expired. " +
                            "Please log in again."
                        );

                        location.reload();

                        return;

                    }


                    const data =
                        await response
                            .json()
                            .catch(() => ({}));

                    message.textContent =
                        data.error ||
                        "Unable to update post.";

                    message.className =
                        "error";

                    return;

                }


                /* =========================
                   CREATE NEW POST
                   ========================= */

                const response =
                    await fetch(
                        "/api/admin/posts",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                title: title,
                                excerpt: excerpt,
                                content: content

                            })
                        }
                    );


                if (response.ok) {

                    document
                        .getElementById("postForm")
                        .reset();

                    message.textContent =
                        "Post published successfully.";

                    message.className =
                        "success";

                    await loadPosts();

                } else if (
                    response.status === 401
                ) {

                    alert(
                        "Your admin session has expired. " +
                        "Please log in again."
                    );

                    location.reload();

                } else {

                    const data =
                        await response
                            .json()
                            .catch(() => ({}));

                    message.textContent =
                        data.error ||
                        "Unable to publish post.";

                    message.className =
                        "error";

                }


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to the server.";

                message.className =
                    "error";

            }

        }
    );


/* =========================================================
   LOAD POSTS
   ========================================================= */

async function loadPosts() {

    const container =
        document.getElementById("posts");


    container.innerHTML =
        '<div class="empty">Loading posts...</div>';


    try {

        const response =
            await fetch("/api/admin/posts");


        if (response.status === 401) {

            document.getElementById("login")
                .style.display = "block";

            document.getElementById("dashboard")
                .style.display = "none";

            return;

        }


        if (!response.ok) {

            throw new Error(
                "Unable to load posts."
            );

        }


        const posts =
            await response.json();


        if (!posts.length) {

            container.innerHTML = `
                <div class="empty">
                    No blog posts yet.
                </div>
            `;

            return;

        }


        container.innerHTML =
            posts
                .map(post => {

                    const date =
                        new Date(
                            post.created_at
                        ).toLocaleDateString(
                            "en-US",
                            {
                                year: "numeric",
                                month: "long",
                                day: "numeric"
                            }
                        );


                    return `

                        <div class="post">

                            <h3>
                                ${escapeHTML(
                                    post.title
                                )}
                            </h3>

                            <div class="date">
                                ${date}
                            </div>

                            ${
                                post.excerpt
                                ?
                                `
                                    <div class="excerpt">
                                        ${escapeHTML(
                                            post.excerpt
                                        )}
                                    </div>
                                `
                                :
                                ""
                            }


                            <div class="post-actions">


                                <!-- VIEW -->

                                <a
                                    class="button-link"
                                    href="/blog/post.html?id=${encodeURIComponent(post.id)}"
                                    target="_blank"
                                >
                                    View
                                </a>


                                <!-- EDIT -->

                                <button
                                    onclick="editPost(${post.id})"
                                >
                                    Edit
                                </button>


                                <!-- DELETE -->

                                <button
                                    class="delete"
                                    onclick='deletePost(
                                        ${post.id},
                                        ${JSON.stringify(post.title)}
                                    )'
                                >
                                    Delete
                                </button>


                            </div>

                        </div>

                    `;

                })
                .join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load posts.
            </div>
        `;

    }

}


/* =========================================================
   EDIT POST
   ========================================================= */

async function editPost(id) {

    try {

        const response =
            await fetch(
                "/api/post?id=" +
                encodeURIComponent(id)
            );


        if (!response.ok) {

            alert(
                "Unable to load this post."
            );

            return;

        }


        const post =
            await response.json();


        editingPostId = id;


        document.getElementById("title")
            .value = post.title || "";


        document.getElementById("excerpt")
            .value = post.excerpt || "";


        document.getElementById("content")
            .value = post.content || "";


        document.getElementById("formTitle")
            .textContent = "Edit Blog Post";


        document.getElementById("submitButton")
            .textContent = "Save Changes";


        document.getElementById("cancelButton")
            .style.display = "inline-block";


        document.getElementById("message")
            .textContent =
                "You are editing this post.";


        document.getElementById("message")
            .className = "";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );

    }

}


/* =========================================================
   CANCEL EDIT
   ========================================================= */

function cancelEdit() {

    editingPostId = null;


    document
        .getElementById("postForm")
        .reset();


    document.getElementById("formTitle")
        .textContent = "Create Blog Post";


    document.getElementById("submitButton")
        .textContent = "Publish Post";


    document.getElementById("cancelButton")
        .style.display = "none";


    document.getElementById("message")
        .textContent = "";


    document.getElementById("message")
        .className = "";

}


/* =========================================================
   DELETE POST
   ========================================================= */

async function deletePost(id, title) {


    const confirmed =
        confirm(
            `Are you sure you want to delete "${title}"?\n\n` +
            `This cannot be undone.`
        );


    if (!confirmed) {

        return;

    }


    try {


        const response =
            await fetch(
                "/api/admin/posts?id=" +
                encodeURIComponent(id),
                {
                    method: "DELETE"
                }
            );


        if (response.ok) {

            if (editingPostId === id) {

                cancelEdit();

            }

            await loadPosts();

            alert(
                "Post deleted successfully."
            );

            return;

        }


        if (response.status === 401) {

            alert(
                "Your admin session has expired. " +
                "Please log in again."
            );

            location.reload();

            return;

        }


        const data =
            await response
                .json()
                .catch(() => ({}));


        alert(
            data.error ||
            "Unable to delete the post."
        );


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );

    }

}


/* =========================================================
   LOG OUT
   ========================================================= */

async function logout() {

    try {

        await fetch(
            "/api/admin/logout",
            {
                method: "POST"
            }
        );

    } finally {

        location.reload();

    }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================================================
   START
   ========================================================= */

checkLogin();

</script>

</body>

</html>
